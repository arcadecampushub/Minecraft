		<script type="text/javascript">
			try {
						if (!localStorage.getItem("_achsSrvFix2")) {
							localStorage.setItem("_achsSrvFix2", "1");
							(function() {
								var raw = null;
						try { raw = localStorage.getItem("_eaglercraftX.s"); } catch (e) { return; }
								if (!raw || typeof DecompressionStream === "undefined" || typeof Response === "undefined" || typeof WritableStream === "undefined") return;
								var bin;
								try { bin = atob(raw); } catch (e) { return; }
								var arr = new Uint8Array(bin.length);
								for (var i = 0; i < bin.length; ++i) arr[i] = bin.charCodeAt(i) & 255;
								if (arr.length < 2 || arr[0] !== 0x1f || arr[1] !== 0x8b) return;
								var chunks = [];
								try {
									new Response(arr.buffer).body.pipeThrough(new DecompressionStream("gzip")).pipeTo(new WritableStream({
										write: function(c) { chunks.push(c); },
										close: function() {
											try {
												var len = 0, i;
												for (i = 0; i < chunks.length; ++i) len += chunks[i].length;
												var nbt = new Uint8Array(len), o = 0;
												for (i = 0; i < chunks.length; ++i) { nbt.set(chunks[i], o); o += chunks[i].length; }
												// scan for every TAG_String named "ip" (0x08, len 0x0002, 'i','p') and read its length
												var found = 0, allEmpty = true;
												for (i = 0; i < nbt.length - 6; ++i) {
													if (nbt[i] === 0x08 && nbt[i+1] === 0x00 && nbt[i+2] === 0x02 && nbt[i+3] === 0x69 && nbt[i+4] === 0x70) {
														var l = (nbt[i+5] << 8) | nbt[i+6];
														found++;
														if (l !== 0) { allEmpty = false; break; }
													}
												}
												if (found > 0 && allEmpty) {
													localStorage.removeItem("_eaglercraftX.s");
													console.warn("[achs] removed degenerate stored server list (no usable entries); baked defaults will show");
												}
											} catch (e) {}
										}
									})).catch(function() {});
								} catch (e) {}
							})();
						}

		<script type="text/javascript">
			"use strict";
			(function() {
				var ASSETS_URL = "https://mc.arcadecampushub.online/assets.epk";
				var wrap = null, fill = null, label = null, hidden = false;
				function build() {
					wrap = document.createElement("div");
					wrap.setAttribute("style", "position:fixed;left:0;right:0;bottom:0;z-index:2147483647;background:#000;padding:8px 12px 10px 12px;font:12px monospace;color:#9a9a9a;");
					fill = document.createElement("div");
					fill.setAttribute("style", "height:3px;width:0%;background:#7cb342;transition:width .2s linear;");
					label = document.createElement("div");
					label.setAttribute("style", "margin-top:5px;");
					label.textContent = "Pre-loading Minecraft assets: 0%";
					wrap.appendChild(fill);
					wrap.appendChild(label);
					(document.body || document.documentElement).appendChild(wrap);
				}
				function pct(p, got) {
					if (hidden) return;
					try {
						if (wrap === null || !wrap.isConnected) build();
						if (document.body && wrap.parentNode !== document.body) document.body.appendChild(wrap);
						fill.style.width = Math.max(0, Math.min(100, p)).toFixed(1) + "%";
						label.textContent = "Pre-loading Minecraft assets: " + Math.floor(Math.max(0, Math.min(100, p))) + "% (" + (got / 1048576).toFixed(0) + " MB)";
					} catch (e) {}
				}
				function done(got) {
					pct(100, got);
					hidden = true;
					setTimeout(function() { try { if (wrap && wrap.parentNode) wrap.parentNode.removeChild(wrap); } catch (e) {} }, 700);
				}
				function fail() { hidden = true; if (wrap && wrap.parentNode) wrap.parentNode.removeChild(wrap); }
				try {
					if (typeof fetch !== "function" || typeof AbortController === "undefined") return;
					fetch(ASSETS_URL, { method: "GET", mode: "cors", credentials: "omit", cache: "default" }).then(function(resp) {
						if (!resp.ok || !resp.body) { fail(); return; }
						var len = parseInt(resp.headers.get("content-length") || "0", 10);
						var reader = resp.body.getReader();
						var got = 0;
						(function step() {
							reader.read().then(function(r) {
								if (r.done) { done(got); return; }
								got += r.value ? r.value.byteLength : 0;
								if (len > 0) pct((got / len) * 100, got); else pct(0, got);
								step();
							}, fail);
						})();
					}, fail);
				} catch (e) {}
			})();
		</script>

			};

				try {
					var AC = window.AudioContext || window.webkitAudioContext;

				gate.innerHTML = '<button type="button" style="font:600 22px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px 44px;border-radius:12px;border:0;background:#3ba55d;color:#fff;cursor:pointer;box-shadow:0 6px 24px rgba(59,165,93,.35);">Click to play</button><div style="font-size:14px;opacity:.65;">Minecraft needs one click to turn on sound</div>';
				var go = function(ev) {
					if (ev && ev.type === "keydown" && (ev.key === "Tab" || ev.key === "Shift")) return;
					document.removeEventListener("keydown", go, true);
					gate.removeEventListener("click", go);
					achsUnlockAudio();
					if (gate.parentNode) gate.parentNode.removeChild(gate);
					onPlay();
				};
				gate.addEventListener("click", go);
				document.addEventListener("keydown", go, true);
				(document.body || document.documentElement).appendChild(gate);
				try { gate.querySelector("button").focus(); } catch (e) {}
			};
			window.addEventListener("load", function() {
				if(window.location.href.indexOf("file:") === 0) {
					alert("HTTP please, do not open this file locally, run a local HTTP server and load it via HTTP");

						var s = q.get("server");
